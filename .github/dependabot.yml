version: 2

# Renovate-style rolling PR: every npm and GitHub Actions update lands in a
# single "dependencies" PR. While that PR is open, each scheduled run rebases
# it and adds any newly available updates instead of opening a new PR.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: "daily"

updates:
  # JavaScript dependencies (pnpm reads the npm ecosystem config)
  - package-ecosystem: "npm"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
    ignore:
      # typescript-eslint (via eslint-config-next) does not support TS 7 yet;
      # drop this once it does.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Pin updates for any GitHub Actions referenced in workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
